services:
  minecraft:
    image: itzg/minecraft-server:java21 # Check on Docker Hub for the java version required by the Minecraft version you want to run
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      MEMORY: 8G
      TZ: Brazil/Sao_Paulo
      TYPE: FABRIC
      EULA: TRUE
      VERSION: 1.21.11 # Specify the Minecraft version you want to run
      MOTD: |
        Servidor §a§lVANILLA§r da rapaziada
        Versão §b§n%VERSION%§r
      DIFFICULTY: normal
      MODE: survival
      LEVEL: world
      ENABLE_WHITELIST: FALSE
      WHITELIST: ""
      ONLINE_MODE: TRUE
      MAX_PLAYERS: 8
      PVP: FALSE
      RCON_PASSWORD: ${MINESERVER_RCON_PASSWORD}
      MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE: alpha
      MODRINTH_LOADER: fabric
      MODRINTH_PROJECTS: |
        # Main mods
        xaeros-minimap
        xaeros-world-map
        xaeros-map-server-utils
        appleskin
        jei
        veinminer
        clumps
        c2me-fabric
        distanthorizons
        # voxy-worldgen
        terralith
        towns-and-towers
        chunky
        crafting-tweaks
        incendium
        double-doors
        dynamic-lights
        trashslot
        rightclickharvest
        # Performance and lib mods
        fabric-api
        cloth-config
        ferrite-core
        lithium
        fabric-language-kotlin
        collective
        balm
        placeholder-api
        krypton
        konkrete
        lithostitched
        cristel-lib
        silk
    volumes:
      - ./minecraft-data:/data
    stdin_open: true
    tty: true
  backup:
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft
      RCON_PASSWORD: ${MINESERVER_RCON_PASSWORD}
      TZ: Brazil/Sao_Paulo
      BACKUP_INTERVAL: 30m
      BACKUP_NAME: world-backup
    volumes:
      - ./minecraft-data:/data:ro