services:
  minecraft:
    image: itzg/minecraft-server:java25 # Check on Docker Hub for the java version required by the Minecraft version you want to run
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      MEMORY: 8G
      TZ: Brazil/Sao_Paulo
      TYPE: FABRIC
      EULA: TRUE
      VERSION: 26.1.2 # Specify the Minecraft version you want to run
      MOTD: |
        Servidor §a§lVANILLA§r da rapaziada
        Versão §b§n%VERSION%§r
      DIFFICULTY: normal
      MODE: survival
      LEVEL: world
      ENABLE_WHITELIST: FALSE
      WHITELIST: ""
      ONLINE_MODE: TRUE
      MAX_PLAYERS: 8
      PVP: FALSE
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        journeymap
        appleskin
        jei?:29.5.0.24
        clumps
        c2me-fabric?:0.3.7+alpha.0.64+26.1.2-rc-1
        distanthorizons?:2.4.5-b-1.21.11
        chunky
        terralith
        incendium?:5.4.12
        lithostitched
        towns-and-towers
        veinminer
        collective
        double-doors
        dynamic-lights
        trashslot
        balm
        placeholder-api
        crafting-tweaks
    volumes:
      - ./minecraft-data:/data
    stdin_open: true
    tty: true
  backup:
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      TZ: Brazil/Sao_Paulo
      BACKUP_INTERVAL: 30m
      BACKUP_NAME: world_%date:yyyy-MM-dd%_backup
    volumes:
      - ./minecraft-data:/data:ro