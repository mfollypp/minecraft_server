services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: minecraft-tailscale
    hostname: ${TS_HOSTNAME:-minecraft-notebook}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft-server
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      - .env
    environment:
      TZ: "${TZ}"
      EULA: "${EULA}"
      VERSION: "${VERSION}"
      TYPE: "${TYPE}"
      FABRIC_LOADER_VERSION: "${FABRIC_LOADER_VERSION}"
      FABRIC_INSTALLER_VERSION: "${FABRIC_INSTALLER_VERSION}"
      MEMORY: "${MEMORY}"
      DIFFICULTY: "${DIFFICULTY}"
      MODE: "${MODE}"
      ONLINE_MODE: "${ONLINE_MODE}"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST}"
      MAX_PLAYERS: "${MAX_PLAYERS}"
      MOTD: "${MOTD}"
      OVERRIDE_SERVER_PROPERTIES: "false"
    volumes:
      - ./data:/data
      - ./config/server.properties:/data/server.properties:ro
      - ./config/ops.json:/data/ops.json
      - ./config/whitelist.json:/data/whitelist.json
      - ./mods:/data/mods
    stdin_open: true
    tty: true
