services:
  minecraft:
    image: itzg/minecraft-server:javaXX # Check on Docker Hub for the java version required by the Minecraft version you want to run
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      MEMORY: 8G
      TZ: Brazil/Sao_Paulo
      TYPE: FABRIC
      EULA: TRUE
      VERSION: X.X.X # Specify the Minecraft version you want to run
      MOTD: |
        Servidor §a§lVANILLA§r da rapaziada
        Versão §b§n%VERSION%§r
      DIFFICULTY: normal
      MODE: survival
      LEVEL: world
      ENABLE_WHITELIST: FALSE
      WHITELIST: ""
      ONLINE_MODE: TRUE
      MAX_PLAYERS: 8
      PVP: FALSE
      RCON_PASSWORD: ${MINESERVER_RCON_PASSWORD}
      MODRINTH_LOADER: fabric
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        xaeros-minimap
        xaeros-world-map
        appleskin
        jei
        clumps
        c2me-fabric
        chunky
        ferrite-core
        konkrete
        krypton
        voxy-worldgen
    volumes:
      - ./minecraft-data:/data
    stdin_open: true
    tty: true
  backup:
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      RCON_PASSWORD: ${MINESERVER_RCON_PASSWORD}
      TZ: Brazil/Sao_Paulo
      BACKUP_INTERVAL: 30m
      BACKUP_NAME: world-backup
    volumes:
      - ./minecraft-data:/data:ro